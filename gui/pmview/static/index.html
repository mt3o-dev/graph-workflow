<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graph Workflow — Project Board</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <h1>Graph&nbsp;Workflow</h1>
  <nav class="tabs">
    <button data-view="board" class="active">Board</button>
    <button data-view="issues">Issues</button>
    <button data-view="search">Search</button>
  </nav>
  <select id="project" aria-label="Project"></select>
  <span id="memory-status" class="pill" title="the write path"></span>
  <button id="info-btn" class="icon-btn" type="button" title="Project info"
          aria-label="Project info" aria-haspopup="dialog" aria-expanded="false">
    <svg viewBox="0 0 16 16" width="17" height="17" fill="none" stroke="currentColor"
         stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
      <circle cx="8" cy="8" r="6.25"/>
      <line x1="8" y1="7.25" x2="8" y2="11.5"/>
      <circle cx="8" cy="4.6" r="0.4" fill="currentColor" stroke="none"/>
    </svg>
  </button>
  <div id="info-popover" class="popover hidden" role="dialog" aria-label="Project info"></div>
</header>

<main>
  <section id="view-board" class="view"></section>
  <section id="view-issues" class="view hidden"></section>
  <section id="view-search" class="view hidden">
    <div class="searchbar">
      <input id="q" type="search" placeholder="Search node bodies, paths and ids…" autocomplete="off">
    </div>
    <div id="search-results" class="list"></div>
  </section>
</main>

<aside id="drawer" class="drawer hidden" aria-label="Detail"></aside>
<div id="scrim" class="scrim hidden"></div>
<div id="toast" class="toast hidden"></div>

<script src="/app.js"></script>
</body>
</html>
