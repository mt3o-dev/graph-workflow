name: release

# Build the install-only-what-you-need assets and attach them to the GitHub
# Release when a version tag is pushed (e.g. `git tag v0.1.0 && git push --tags`).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build assets
        run: python scripts/build.py all --version "${GITHUB_REF_NAME#v}"

      - name: List built assets
        run: ls -la dist/

      - name: Attach assets to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pmview.pyz
            dist/gw-skills-*.tar.gz
          fail_on_unmatched_files: true
